<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamental Analysis Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F7F2;
    --paper-raised:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --ink-faint:#8B93A0;
    --line:#DBD7CA;
    --line-strong:#B9B3A0;
    --green:#1F5C4A;
    --green-soft:#E6EEE9;
    --rust:#9A3B32;
    --rust-soft:#F3E7E4;
    --gold:#8A6A20;
    --gold-soft:#F1E9D6;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:880px;margin:0 auto;padding:56px 24px 120px;}
  @media (max-width:600px){#app{padding:36px 16px 90px;}}

  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink);}
  .num{font-variant-numeric:tabular-nums;}
  a{color:var(--ink);}
  button{font-family:var(--sans);cursor:pointer;}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--green);outline-offset:2px;
  }

  /* ---------- Hero / Upload ---------- */
  .hero{animation:rise .6s ease-out;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .hero h1{font-size:clamp(28px,4.2vw,42px);line-height:1.15;max-width:15ch;}
  .hero p.sub{margin:16px 0 0;max-width:52ch;color:var(--ink-soft);font-size:16px;}

  .dropzone{
    margin-top:40px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    background:var(--paper-raised);
    padding:40px 28px;
    text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{border-color:var(--green);background:var(--green-soft);}
  .dropzone .dz-inner{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .dz-icon{
    flex:0 0 auto;width:44px;height:44px;border:1px solid var(--line-strong);
    border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
  }
  .dz-text strong{display:block;font-size:15px;color:var(--ink);margin-bottom:2px;}
  .dz-text span{font-size:13px;color:var(--ink-faint);}
  .dropzone input[type=file]{display:none;}
  .browse-btn{
    margin-left:auto;background:var(--ink);color:var(--paper);border:none;
    padding:10px 18px;font-size:14px;font-weight:600;border-radius:var(--radius);
  }
  .browse-btn:hover{background:#000;}

  .file-chip{
    margin-top:18px;display:flex;align-items:center;gap:12px;
    border-top:1px solid var(--line);padding-top:16px;
  }
  .file-chip .name{font-size:14px;font-weight:600;}
  .file-chip .meta{font-size:13px;color:var(--ink-faint);}
  .file-chip .clear{margin-left:auto;background:none;border:none;color:var(--ink-faint);font-size:13px;text-decoration:underline;}

  .run-btn{
    margin-top:24px;background:var(--green);color:#fff;border:none;
    padding:13px 22px;font-size:15px;font-weight:600;border-radius:var(--radius);
    display:inline-flex;align-items:center;gap:8px;
  }
  .run-btn:disabled{background:var(--line-strong);cursor:not-allowed;}
  .run-btn:not(:disabled):hover{background:#154538;}

  .covers{margin-top:56px;border-top:1px solid var(--line);padding-top:24px;}
  .covers h3{font-size:13px;text-transform:none;color:var(--ink-soft);font-family:var(--sans);font-weight:600;}
  .cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;margin-top:16px;}
  .cover-grid div{font-size:14px;color:var(--ink-soft);border-left:2px solid var(--line-strong);padding-left:10px;}

  .error-box{
    margin-top:20px;border:1px solid var(--rust);background:var(--rust-soft);
    color:var(--rust);padding:14px 16px;border-radius:var(--radius);font-size:14px;
  }

  /* ---------- Analyzing ---------- */
  .analyzing h2{font-size:22px;}
  .analyzing .fname{color:var(--ink-soft);font-size:14px;margin-top:6px;}
  .checklist{margin-top:32px;border-top:1px solid var(--line);}
  .check-row{
    display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);
    font-size:15px;
  }
  .check-mark{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;
  }
  .check-row.done .check-mark{background:var(--green);border-color:var(--green);color:#fff;}
  .check-row.active .check-mark{border-color:var(--green);}
  .check-row.error .check-mark{background:var(--rust);border-color:var(--rust);color:#fff;}
  .check-row.pending{color:var(--ink-faint);}
  .spin{
    width:12px;height:12px;border:2px solid var(--line-strong);border-top-color:var(--green);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Report ---------- */
  .report-header{border-bottom:1px solid var(--line);padding-bottom:24px;}
  .report-header .co{font-size:13px;color:var(--ink-faint);letter-spacing:.2px;}
  .report-header h1{margin-top:4px;font-size:clamp(24px,3.6vw,34px);}
  .snapshot-row{display:flex;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
    font-size:13px;font-weight:600;
  }
  .pill.green{background:var(--green-soft);color:var(--green);}
  .pill.gold{background:var(--gold-soft);color:var(--gold);}
  .pill.rust{background:var(--rust-soft);color:var(--rust);}
  .pill.neutral{background:#EDEBE3;color:var(--ink-soft);}
  .summary-line{margin-top:14px;font-size:16px;max-width:64ch;color:var(--ink);}

  .section{border-bottom:1px solid var(--line);padding:32px 0;}
  .section:last-of-type{border-bottom:none;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .section-head h2{font-size:19px;}
  .section-head .score-pill{flex:0 0 auto;}
  .section .highlight{margin-top:8px;font-size:14.5px;color:var(--ink-soft);max-width:60ch;}

  table.metrics{width:100%;border-collapse:collapse;margin-top:18px;font-size:14.5px;}
  table.metrics th{
    text-align:left;font-weight:600;color:var(--ink-faint);font-size:12px;
    padding:0 0 8px;border-bottom:1px solid var(--line);font-family:var(--sans);
  }
  table.metrics td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  table.metrics tr:last-child td{border-bottom:none;}
  table.metrics td.label{width:38%;color:var(--ink);font-weight:500;}
  table.metrics td.value{font-weight:600;white-space:nowrap;}
  table.metrics td.trend{width:36px;color:var(--ink-faint);text-align:center;}
  table.metrics td.note{color:var(--ink-soft);font-size:13.5px;}

  .commentary{margin-top:16px;font-size:14.5px;color:var(--ink);max-width:64ch;}

  .flags{list-style:none;margin:18px 0 0;padding:0;}
  .flags li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .flags li:last-child{border-bottom:none;}
  .sev{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;height:fit-content;letter-spacing:.3px;}
  .sev.high{background:var(--rust-soft);color:var(--rust);}
  .sev.medium{background:var(--gold-soft);color:var(--gold);}
  .sev.low{background:#EDEBE3;color:var(--ink-soft);}
  .flag-body strong{display:block;font-size:14.5px;margin-bottom:2px;}
  .flag-body span{font-size:13.5px;color:var(--ink-soft);}
  .no-flags{margin-top:16px;font-size:14.5px;color:var(--ink-soft);}

  .verdict-panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;margin-top:18px;}
  .verdict-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px;}
  @media (max-width:600px){.verdict-cols{grid-template-columns:1fr;}}
  .verdict-cols h4{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-faint);margin:0 0 10px;}
  .verdict-cols ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink);}
  .verdict-cols li{margin-bottom:6px;}
  .verdict-text{margin-top:20px;font-size:15px;line-height:1.6;color:var(--ink);}

  .module-error{margin-top:14px;font-size:13.5px;color:var(--rust);}
  .retry-btn{margin-top:8px;background:none;border:1px solid var(--line-strong);color:var(--ink);
    padding:6px 12px;font-size:13px;border-radius:var(--radius);}
  .retry-btn:hover{border-color:var(--ink);}

  .ask-block{margin-top:8px;}
  .ask-row{display:flex;gap:10px;margin-top:16px;}
  .ask-row input{
    flex:1;border:1px solid var(--line-strong);border-radius:var(--radius);padding:11px 14px;
    font-size:14.5px;font-family:var(--sans);background:var(--paper-raised);color:var(--ink);
  }
  .ask-row button{
    background:var(--ink);color:var(--paper);border:none;padding:0 18px;border-radius:var(--radius);
    font-size:14px;font-weight:600;
  }
  .ask-row button:disabled{background:var(--line-strong);}
  .qa-thread{margin-top:20px;display:flex;flex-direction:column;gap:16px;}
  .qa-item .q{font-weight:600;font-size:14.5px;}
  .qa-item .a{margin-top:6px;font-size:14.5px;color:var(--ink-soft);white-space:pre-wrap;}

  .reset-row{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);}
  .reset-btn{background:none;border:1px solid var(--line-strong);color:var(--ink);
    padding:10px 18px;border-radius:var(--radius);font-size:14px;font-weight:600;}
  .reset-btn:hover{border-color:var(--ink);}

  .disclaimer{margin-top:28px;font-size:12.5px;color:var(--ink-faint);max-width:64ch;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  var MODEL = "claude-sonnet-4-6";

  var MODULES = [
    {
      key:"profitability",
      label:"Profitability",
      focus:"Assess how well the company converts revenue into profit and converts capital into returns. Cover gross margin, operating margin, net margin, return on assets (ROA), return on equity (ROE), and — if the balance sheet allows — a DuPont-style decomposition of ROE into net margin x asset turnover x equity multiplier. Compare across the periods provided and note the direction of travel.",
      schema:'{"score": <1-10 integer>, "metrics": [{"label": string, "value": string, "trend": "up"|"down"|"flat"|"n/a", "note": string}], "commentary": string (2-3 sentences), "highlight": string (one short sentence, the single most important takeaway)}'
    },
    {
      key:"liquidity_solvency",
      label:"Liquidity & Solvency",
      focus:"Assess the company's ability to meet short-term obligations (liquidity) and its long-term capital structure risk (solvency). Cover current ratio, quick ratio, cash ratio if inventory data allows, debt-to-equity, debt-to-assets, and interest coverage if interest expense is available.",
      schema:'{"score": <1-10 integer>, "metrics": [{"label": string, "value": string, "trend": "up"|"down"|"flat"|"n/a", "note": string}], "commentary": string (2-3 sentences), "highlight": string (one short sentence)}'
    },
    {
      key:"efficiency",
      label:"Operating Efficiency",
      focus:"Assess how efficiently the company uses its assets and working capital. Cover asset turnover, inventory turnover and days, receivables turnover and days sales outstanding (DSO), payables days if available, and the cash conversion cycle.",
      schema:'{"score": <1-10 integer>, "metrics": [{"label": string, "value": string, "trend": "up"|"down"|"flat"|"n/a", "note": string}], "commentary": string (2-3 sentences), "highlight": string (one short sentence)}'
    },
    {
      key:"growth",
      label:"Growth",
      focus:"Assess top-line and bottom-line growth trends across the periods provided: revenue growth, net income growth, EPS growth, and whether growth is consistent, accelerating, decelerating, or erratic.",
      schema:'{"score": <1-10 integer>, "metrics": [{"label": string, "value": string, "trend": "up"|"down"|"flat"|"n/a", "note": string}], "commentary": string (2-3 sentences), "highlight": string (one short sentence)}'
    },
    {
      key:"cash_flow_quality",
      label:"Cash Flow Quality",
      focus:"Assess the quality of earnings and cash generation. Compare operating cash flow to net income (an accruals sanity check), compute free cash flow (operating CF minus capex) if data allows, capex intensity as a percent of revenue, and FCF margin. Flag if net income is consistently higher than operating cash flow.",
      schema:'{"score": <1-10 integer>, "metrics": [{"label": string, "value": string, "trend": "up"|"down"|"flat"|"n/a", "note": string}], "commentary": string (2-3 sentences), "highlight": string (one short sentence)}'
    },
    {
      key:"valuation",
      label:"Valuation",
      focus:"If market_data (share price and/or shares outstanding) is present in the extracted data, compute P/E, P/B, and EV/EBITDA where possible, plus dividend yield if dividend data exists. If market_data is missing or incomplete, set score to null, leave metrics as an empty array, and explain in commentary that market price data was not present in the filing so market multiples could not be computed, offering book value per share instead if derivable.",
      schema:'{"score": <1-10 integer or null>, "metrics": [{"label": string, "value": string, "trend": "up"|"down"|"flat"|"n/a", "note": string}], "commentary": string (2-3 sentences), "highlight": string (one short sentence)}'
    },
    {
      key:"red_flags",
      label:"Red Flags & Earnings Quality",
      focus:"Scan the extracted data for signs of financial stress or lower-quality earnings: revenue growth outpacing cash collection, margin compression, rising leverage alongside falling coverage, net income diverging from operating cash flow, unusual working-capital swings, negative equity, or any other pattern a careful analyst would flag. If nothing concerning stands out, return an empty flags array rather than inventing issues.",
      schema:'{"flags": [{"flag": string (short title), "severity": "high"|"medium"|"low", "explanation": string (1-2 sentences)}], "overall_quality_note": string (one sentence on overall earnings quality)}'
    }
  ];

  var state = {
    stage:"upload", // upload | analyzing | report
    file:null,      // {name, size, mediaType, base64}
    dragOver:false,
    error:null,
    extraction:null,
    moduleStatus:{}, // key -> "pending"|"active"|"done"|"error"
    moduleData:{},   // key -> parsed json
    moduleError:{},  // key -> error string
    synthesis:null,
    synthesisStatus:"pending",
    qa:[],
    asking:false
  };

  function render(){
    var app = document.getElementById("app");
    if(state.stage==="upload") app.innerHTML = renderUpload();
    else if(state.stage==="analyzing") app.innerHTML = renderAnalyzing();
    else app.innerHTML = renderReport();
    bindEvents();
  }

  // ---------------- Upload stage ----------------
  function renderUpload(){
    var fileChip = state.file ? (
      '<div class="file-chip">'+
        '<div class="name">'+escapeHtml(state.file.name)+'</div>'+
        '<div class="meta">'+formatBytes(state.file.size)+'</div>'+
        '<button class="clear" data-action="clear-file">Remove</button>'+
      '</div>'
    ) : "";

    var errorBox = state.error ? '<div class="error-box">'+escapeHtml(state.error)+'</div>' : "";

    return ''+
    '<div class="hero">'+
      '<h1>Read the filing. See the fundamentals.</h1>'+
      '<p class="sub">Upload an annual report, interim statement, or prospectus. The agent extracts the numbers itself, then works through profitability, liquidity, solvency, efficiency, growth, cash-flow quality, valuation, and red flags — one module at a time.</p>'+
      '<div class="dropzone" id="dropzone">'+
        '<div class="dz-inner">'+
          '<div class="dz-icon">'+fileIconSvg()+'</div>'+
          '<div class="dz-text">'+
            '<strong>Drop a financial report here</strong>'+
            '<span>PDF, PNG, or JPG &middot; works best under ~8 MB &middot; a text-based PDF beats a scanned one</span>'+
          '</div>'+
          '<button class="browse-btn" data-action="browse">Choose file</button>'+
        '</div>'+
        '<input type="file" id="file-input" accept="application/pdf,image/png,image/jpeg">'+
        fileChip+
      '</div>'+
      errorBox+
      '<button class="run-btn" id="run-btn" '+(state.file?"":"disabled")+'>Analyze report</button>'+
    '</div>'+
    '<div class="covers">'+
      '<h3>What each pass covers</h3>'+
      '<div class="cover-grid">'+
        '<div>Profitability &amp; DuPont</div>'+
        '<div>Liquidity &amp; solvency</div>'+
        '<div>Operating efficiency</div>'+
        '<div>Growth trend</div>'+
        '<div>Cash flow quality</div>'+
        '<div>Valuation multiples</div>'+
        '<div>Red flags &amp; earnings quality</div>'+
        '<div>Overall verdict</div>'+
      '</div>'+
    '</div>'+
    '<p class="disclaimer">Analysis is generated from the document you upload and may misread scanned or low-quality pages. This is not investment advice — verify figures against the source filing before acting on them.</p>';
  }

  function fileIconSvg(){
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  }

  function formatBytes(b){
    if(b<1024) return b+" B";
    if(b<1024*1024) return (b/1024).toFixed(0)+" KB";
    return (b/(1024*1024)).toFixed(1)+" MB";
  }

  function escapeHtml(s){
    if(s===null||s===undefined) return "";
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------------- Analyzing stage ----------------
  function renderAnalyzing(){
    var rows = "";
    rows += checkRow("extraction", "Reading the filing", state.extraction ? "done" : (state.error?"error":"active"));
    MODULES.forEach(function(m){
      var st = state.moduleStatus[m.key] || "pending";
      rows += checkRow(m.key, m.label, st, state.moduleError[m.key]);
    });
    rows += checkRow("synthesis", "Forming the verdict", state.synthesisStatus);

    return ''+
    '<div class="analyzing">'+
      '<h2>Analyzing the report</h2>'+
      '<div class="fname">'+escapeHtml(state.file ? state.file.name : "")+'</div>'+
      '<div class="checklist">'+rows+'</div>'+
      (state.error ? '<div class="error-box">'+escapeHtml(state.error)+
        '<div style="margin-top:10px;"><button class="retry-btn" id="retry-extraction-btn">Try again</button></div></div>' : '')+
    '</div>';
  }

  function checkRow(key, label, status, errText){
    var cls = "check-row " + status;
    var mark = "";
    if(status==="done") mark = "&#10003;";
    else if(status==="active") mark = '<span class="spin"></span>';
    else if(status==="error") mark = "&#33;";
    var extra = (status==="error" && errText) ? ' <span style="color:var(--rust);font-size:12.5px;">('+escapeHtml(errText)+')</span>' : '';
    return '<div class="'+cls+'"><div class="check-mark">'+mark+'</div><div>'+escapeHtml(label)+extra+'</div></div>';
  }

  // ---------------- Report stage ----------------
  function scorePill(score, labelIfNull){
    if(score===null || score===undefined || score===""){
      return '<span class="pill neutral">'+(labelIfNull||"n/a")+'</span>';
    }
    var n = Number(score);
    var cls = n>=7 ? "green" : (n>=4 ? "gold" : "rust");
    return '<span class="pill '+cls+'">'+n+'/10</span>';
  }

  function trendArrow(t){
    if(t==="up") return "&#9650;";
    if(t==="down") return "&#9660;";
    if(t==="flat") return "&#8212;";
    return "";
  }

  function moduleSection(m){
    var status = state.moduleStatus[m.key];
    var data = state.moduleData[m.key];
    var head = '<div class="section-head"><h2>'+escapeHtml(m.label)+'</h2>'+
      (data ? scorePill(data.score) : '') + '</div>';

    if(status==="error"){
      return '<div class="section">'+head+
        '<div class="module-error">Could not complete this module'+(state.moduleError[m.key]?(": "+escapeHtml(state.moduleError[m.key])):".")+'</div>'+
        '<button class="retry-btn" data-action="retry-module" data-key="'+m.key+'">Retry</button>'+
      '</div>';
    }
    if(!data){
      return '<div class="section">'+head+'<div class="highlight">Pending&hellip;</div></div>';
    }

    if(m.key==="red_flags"){
      var flags = data.flags || [];
      var body = flags.length ? (
        '<ul class="flags">'+ flags.map(function(f){
          return '<li><span class="sev '+esc(f.severity)+'">'+escapeHtml((f.severity||"").toUpperCase())+'</span>'+
            '<div class="flag-body"><strong>'+escapeHtml(f.flag)+'</strong><span>'+escapeHtml(f.explanation)+'</span></div></li>';
        }).join('') + '</ul>'
      ) : '<div class="no-flags">No material red flags surfaced from the data provided.</div>';
      return '<div class="section">'+
        '<div class="section-head"><h2>'+escapeHtml(m.label)+'</h2></div>'+
        body+
        (data.overall_quality_note ? '<div class="commentary">'+escapeHtml(data.overall_quality_note)+'</div>' : '')+
      '</div>';
    }

    var metricsHtml = "";
    if(data.metrics && data.metrics.length){
      metricsHtml = '<table class="metrics"><thead><tr><th>Metric</th><th></th><th>Value</th><th>Note</th></tr></thead><tbody>'+
        data.metrics.map(function(row){
          return '<tr><td class="label">'+escapeHtml(row.label)+'</td>'+
            '<td class="trend">'+trendArrow(row.trend)+'</td>'+
            '<td class="value num">'+escapeHtml(row.value)+'</td>'+
            '<td class="note">'+escapeHtml(row.note||"")+'</td></tr>';
        }).join('')+
      '</tbody></table>';
    }

    return '<div class="section">'+head+
      (data.highlight ? '<div class="highlight">'+escapeHtml(data.highlight)+'</div>' : '')+
      metricsHtml+
      (data.commentary ? '<div class="commentary">'+escapeHtml(data.commentary)+'</div>' : '')+
    '</div>';
  }
  function esc(s){ return (s||"low").toLowerCase(); }

  function renderReport(){
    var ex = state.extraction || {};
    var syn = state.synthesis;

    var header = ''+
    '<div class="report-header">'+
      '<div class="co">'+escapeHtml(ex.report_type||"Financial report")+(ex.currency?(' &middot; '+escapeHtml(ex.currency)):'')+'</div>'+
      '<h1>'+escapeHtml(ex.company_name||"Unnamed company")+'</h1>'+
      '<div class="snapshot-row">'+
        (syn ? scorePill(syn.overall_score) : '<span class="pill neutral">Scoring&hellip;</span>')+
        (syn && syn.stance ? '<span class="pill neutral">'+escapeHtml(syn.stance)+'</span>' : '')+
      '</div>'+
      (syn && syn.one_line_summary ? '<div class="summary-line">'+escapeHtml(syn.one_line_summary)+'</div>' : '')+
    '</div>';

    var sections = MODULES.map(moduleSection).join('');

    var verdict = "";
    if(syn){
      verdict = '<div class="section">'+
        '<div class="section-head"><h2>Verdict</h2></div>'+
        '<div class="verdict-panel">'+
          '<div class="verdict-cols">'+
            '<div><h4>Strengths</h4><ul>'+(syn.top_strengths||[]).map(function(s){return '<li>'+escapeHtml(s)+'</li>';}).join('')+'</ul></div>'+
            '<div><h4>Risks</h4><ul>'+(syn.top_risks||[]).map(function(s){return '<li>'+escapeHtml(s)+'</li>';}).join('')+'</ul></div>'+
          '</div>'+
          '<div class="verdict-text">'+escapeHtml(syn.verdict||"")+'</div>'+
        '</div>'+
      '</div>';
    }

    var qaThread = state.qa.map(function(item){
      return '<div class="qa-item"><div class="q">'+escapeHtml(item.q)+'</div><div class="a">'+escapeHtml(item.a)+'</div></div>';
    }).join('');

    var askSection = '<div class="section ask-block">'+
      '<div class="section-head"><h2>Ask about this report</h2></div>'+
      '<div class="ask-row">'+
        '<input type="text" id="ask-input" placeholder="e.g. How does the leverage compare to last year?" '+(state.asking?"disabled":"")+'>'+
        '<button id="ask-btn" '+(state.asking?"disabled":"")+'>'+(state.asking?"Asking…":"Ask")+'</button>'+
      '</div>'+
      (qaThread ? '<div class="qa-thread">'+qaThread+'</div>' : '')+
    '</div>';

    var dataGaps = (ex.data_gaps && ex.data_gaps.length) ?
      '<p class="disclaimer">Not found in the filing: '+ex.data_gaps.map(escapeHtml).join('; ')+'.</p>' : '';

    return header + sections + verdict + askSection +
      '<div class="reset-row"><button class="reset-btn" id="reset-btn">Analyze another report</button></div>'+
      dataGaps+
      '<p class="disclaimer">Generated from the uploaded document. Not investment advice — confirm figures against the source filing.</p>';
  }

  // ---------------- Events ----------------
  function bindEvents(){
    if(state.stage==="upload"){
      var dz = document.getElementById("dropzone");
      var fi = document.getElementById("file-input");
      var browseBtn = document.querySelector('[data-action="browse"]');
      if(browseBtn) browseBtn.onclick = function(){ fi.click(); };
      if(fi) fi.onchange = function(e){ if(e.target.files[0]) handleFile(e.target.files[0]); };
      if(dz){
        dz.ondragover = function(e){ e.preventDefault(); dz.classList.add("drag"); };
        dz.ondragleave = function(){ dz.classList.remove("drag"); };
        dz.ondrop = function(e){
          e.preventDefault(); dz.classList.remove("drag");
          if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
      }
      var clearBtn = document.querySelector('[data-action="clear-file"]');
      if(clearBtn) clearBtn.onclick = function(){ state.file=null; state.error=null; render(); };
      var runBtn = document.getElementById("run-btn");
      if(runBtn) runBtn.onclick = function(){ startAnalysis(); };
    }
    if(state.stage==="analyzing"){
      var retryExtractBtn = document.getElementById("retry-extraction-btn");
      if(retryExtractBtn) retryExtractBtn.onclick = function(){ startAnalysis(); };
    }
    if(state.stage==="report"){
      var resetBtn = document.getElementById("reset-btn");
      if(resetBtn) resetBtn.onclick = function(){ resetAll(); };
      var askBtn = document.getElementById("ask-btn");
      var askInput = document.getElementById("ask-input");
      if(askBtn) askBtn.onclick = function(){ submitAsk(); };
      if(askInput) askInput.onkeydown = function(e){ if(e.key==="Enter") submitAsk(); };
      document.querySelectorAll('[data-action="retry-module"]').forEach(function(btn){
        btn.onclick = function(){ retryModule(btn.getAttribute("data-key")); };
      });
    }
  }

  function handleFile(file){
    var allowed = ["application/pdf","image/png","image/jpeg"];
    if(allowed.indexOf(file.type)===-1){
      state.error = "Please upload a PDF, PNG, or JPG file.";
      render();
      return;
    }
    if(file.size > 25*1024*1024){
      state.error = "That file is larger than 25 MB — try a smaller export of the report.";
      render();
      return;
    }
    state.error = null;
    var reader = new FileReader();
    reader.onload = function(){
      var result = reader.result; // data:mime;base64,XXXX
      var base64 = result.split(",")[1];
      state.file = { name:file.name, size:file.size, mediaType:file.type, base64:base64 };
      render();
    };
    reader.onerror = function(){
      state.error = "Could not read that file. Please try again.";
      render();
    };
    reader.readAsDataURL(file);
  }

  function resetAll(){
    state = {
      stage:"upload", file:null, dragOver:false, error:null,
      extraction:null, moduleStatus:{}, moduleData:{}, moduleError:{},
      synthesis:null, synthesisStatus:"pending", qa:[], asking:false
    };
    render();
  }

  // ---------------- Claude API ----------------
  function callClaude(system, userContent){
    return fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        system: system,
        messages: [{ role:"user", content: userContent }]
      })
    }).then(function(res){
      return res.json();
    }).then(function(data){
      if(data && data.error){ throw new Error(data.error.message || "API error"); }
      var textBlock = (data.content||[]).find(function(b){ return b.type==="text"; });
      if(!textBlock) throw new Error("No response text");
      return textBlock.text;
    });
  }

  function parseJsonSafe(text){
    var cleaned = text.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
    try{
      return JSON.parse(cleaned);
    }catch(e){
      var start = cleaned.indexOf("{");
      var end = cleaned.lastIndexOf("}");
      if(start!==-1 && end!==-1 && end>start){
        try{ return JSON.parse(cleaned.substring(start,end+1)); }catch(e2){}
      }
      throw new Error("Could not parse response");
    }
  }

  var EXTRACTION_SYSTEM = "You are a financial data extraction engine. You will be shown a financial report (annual report, interim statement, or prospectus). "+
    "Extract only the two most recent reporting periods available (oldest first). Output ONLY valid JSON, no markdown fences, no commentary, matching exactly this shape:\n"+
    '{"company_name": string, "report_type": string, "currency": string, "units": string (e.g. "as reported", "thousands", "millions"), '+
    '"periods": [string, string], '+
    '"income_statement": {"revenue": [num|null,num|null], "gross_profit": [num|null,num|null], "operating_income": [num|null,num|null], "net_income": [num|null,num|null], "eps": [num|null,num|null], "interest_expense": [num|null,num|null]}, '+
    '"balance_sheet": {"total_assets": [num|null,num|null], "current_assets": [num|null,num|null], "cash": [num|null,num|null], "inventory": [num|null,num|null], "receivables": [num|null,num|null], "current_liabilities": [num|null,num|null], "total_liabilities": [num|null,num|null], "total_debt": [num|null,num|null], "total_equity": [num|null,num|null], "payables": [num|null,num|null]}, '+
    '"cash_flow": {"operating_cf": [num|null,num|null], "investing_cf": [num|null,num|null], "financing_cf": [num|null,num|null], "capex": [num|null,num|null]}, '+
    '"market_data": {"share_price": num|null, "shares_outstanding": num|null, "dividend_per_share": num|null}, '+
    '"data_gaps": [string] (short notes on what standard line items were not found in the filing)}\n'+
    "Use null for any figure not present. Do not guess or fabricate numbers. Keep the JSON compact and ensure it is complete and valid — closing every bracket matters more than including every field.";

  function buildModuleSystem(m){
    return "You are a fundamental equity analyst. You will be given previously extracted financial data as JSON, covering up to two reporting periods (oldest first). "+
    "Task: "+m.focus+" Base every number strictly on the data provided; if a figure needed for a ratio is null, omit that metric rather than guessing. "+
    "Output ONLY valid JSON, no markdown fences, no commentary outside the JSON, matching exactly this shape:\n"+m.schema+"\n"+
    "Be concise — this must fit comfortably in a short response. Ensure the JSON is complete and valid.";
  }

  var SYNTHESIS_SYSTEM = "You are the lead analyst synthesizing a fundamental analysis. You will be given the extracted financial data plus the results of several completed analysis modules (profitability, liquidity & solvency, efficiency, growth, cash flow quality, valuation, red flags), each as JSON. "+
    "Write an overall verdict. Output ONLY valid JSON, no markdown fences, matching exactly this shape:\n"+
    '{"overall_score": <1-10 integer>, "stance": string (one of: "Strong fundamentals", "Constructive", "Mixed", "Cautious", "Weak fundamentals"), "one_line_summary": string (under 20 words), "top_strengths": [string, string, string], "top_risks": [string, string, string], "verdict": string (3-4 sentences, plain and direct)}\n'+
    "Weigh the red flags module heavily when setting the stance. Ensure the JSON is complete and valid.";

  function startAnalysis(){
    state.stage = "analyzing";
    state.error = null;
    render();

    var docBlock = state.file.mediaType==="application/pdf"
      ? { type:"document", source:{ type:"base64", media_type:"application/pdf", data:state.file.base64 } }
      : { type:"image", source:{ type:"base64", media_type:state.file.mediaType, data:state.file.base64 } };

    callClaude(EXTRACTION_SYSTEM, [ docBlock, { type:"text", text:"Extract the data as specified in the system prompt." } ])
      .then(function(text){
        var parsed = parseJsonSafe(text);
        state.extraction = parsed;
        render();
        runAllModules();
      })
      .catch(function(err){
        state.error = friendlyFetchError(err, state.file);
        render();
      });
  }

  function friendlyFetchError(err, file){
    var msg = err && err.message ? err.message : String(err);
    if(/failed to fetch/i.test(msg)){
      var sizeNote = (file && file.size > 8*1024*1024)
        ? " This file is " + formatBytes(file.size) + " — large, image-heavy, or many-page PDFs (common with scanned annual reports) are the most frequent cause. Try trimming it to just the financial statements section (income statement, balance sheet, cash flow, and notes — usually the last 30–60 pages), or export a lighter, text-based PDF instead of a scanned one."
        : " This is usually a temporary network hiccup — try again, and if it keeps happening, try a smaller or text-based export of the report.";
      return "Could not send this file for analysis." + sizeNote;
    }
    return "Could not read financial data from this file (" + msg + "). Try a clearer scan, a text-based PDF, or a smaller file.";
  }

  function runAllModules(){
    var extractionStr = JSON.stringify(state.extraction);
    var promises = MODULES.map(function(m){
      state.moduleStatus[m.key] = "active";
      return callClaude(buildModuleSystem(m), [{ type:"text", text: "Extracted data:\n"+extractionStr+"\n\nProduce the analysis as specified in the system prompt." }])
        .then(function(text){
          state.moduleData[m.key] = parseJsonSafe(text);
          state.moduleStatus[m.key] = "done";
          render();
        })
        .catch(function(err){
          state.moduleStatus[m.key] = "error";
          state.moduleError[m.key] = err.message;
          render();
        });
    });
    render();
    Promise.allSettled ? Promise.allSettled(promises).then(runSynthesis) : Promise.all(promises.map(function(p){return p.catch(function(){});})).then(runSynthesis);
  }

  function retryModule(key){
    var m = MODULES.find(function(x){ return x.key===key; });
    if(!m) return;
    state.moduleStatus[key] = "active";
    state.moduleError[key] = null;
    render();
    var extractionStr = JSON.stringify(state.extraction);
    callClaude(buildModuleSystem(m), [{ type:"text", text: "Extracted data:\n"+extractionStr+"\n\nProduce the analysis as specified in the system prompt." }])
      .then(function(text){
        state.moduleData[key] = parseJsonSafe(text);
        state.moduleStatus[key] = "done";
        render();
      })
      .catch(function(err){
        state.moduleStatus[key] = "error";
        state.moduleError[key] = err.message;
        render();
      });
  }

  function runSynthesis(){
    state.synthesisStatus = "active";
    if(state.stage==="analyzing") render();
    var payload = { extraction: state.extraction, modules: state.moduleData };
    callClaude(SYNTHESIS_SYSTEM, [{ type:"text", text: JSON.stringify(payload)+"\n\nProduce the verdict as specified in the system prompt." }])
      .then(function(text){
        state.synthesis = parseJsonSafe(text);
        state.synthesisStatus = "done";
        state.stage = "report";
        render();
      })
      .catch(function(err){
        state.synthesisStatus = "error";
        // still show the report even if synthesis fails — modules are the substance
        state.stage = "report";
        render();
      });
  }

  function submitAsk(){
    var input = document.getElementById("ask-input");
    var q = input.value.trim();
    if(!q || state.asking) return;
    state.asking = true;
    render();
    var context = { extraction: state.extraction, modules: state.moduleData, synthesis: state.synthesis };
    var system = "You are a fundamental equity analyst answering a follow-up question about a report you already analyzed. "+
      "Use only the extracted data and module results provided as context. Answer in plain prose, under 120 words, no markdown formatting, no JSON.";
    callClaude(system, [{ type:"text", text: "Context:\n"+JSON.stringify(context)+"\n\nQuestion: "+q }])
      .then(function(answer){
        state.qa.push({ q:q, a:answer.trim() });
        state.asking = false;
        render();
      })
      .catch(function(err){
        state.qa.push({ q:q, a:"Could not get an answer (" + err.message + ")." });
        state.asking = false;
        render();
      });
  }

  render();
})();
</script>
</body>
</html>
