<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Ratio Analyzer</title>
  <!-- Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- In-browser Word (.docx) parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow border border-gray-200">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Financial Statement Ratio Analyzer</h1>
      <p class="text-sm text-gray-500">Upload an annual report or financial statement in <strong>PDF</strong> or <strong>Word (.docx)</strong> format to calculate profitability, earnings, solvency, liquidity, and valuation metrics.</p>
    </header>

    <!-- Inputs Form -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Gemini API Key</label>
        <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Current Share Price (Optional)</label>
        <input id="sharePrice" type="number" step="any" placeholder="Required for P/E, P/B, EV/EBITDA" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-semibold text-gray-700 mb-1">Upload Report (PDF or Word .docx)</label>
      <input id="fileUpload" type="file" accept=".pdf, .docx, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="w-full border rounded-lg p-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
    </div>

    <button id="runBtn" onclick="processDocument()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-150">
      Analyze Document & Calculate Ratios
    </button>

    <!-- Status Message -->
    <div id="status" class="mt-4 text-sm font-medium text-blue-600 hidden"></div>

    <!-- Output Section -->
    <div id="results" class="mt-8 hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 border-b pb-3">
        <h2 class="text-xl font-bold text-gray-900">Analysis Results</h2>
        <button onclick="downloadCSV()" class="inline-flex items-center justify-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition">
          Export to CSV
        </button>
      </div>

      <!-- Ratio Tables -->
      <div id="tablesContainer" class="space-y-6 mb-8"></div>

      <!-- Auditability Accordion -->
      <details class="bg-gray-50 border rounded-lg p-4 text-sm">
        <summary class="font-semibold text-gray-700 cursor-pointer select-none">
          View Extracted Line Items (Source Data Verification)
        </summary>
        <div id="extractedDataView" class="mt-3 overflow-x-auto"></div>
      </details>
    </div>
  </div>

  <script>
    let globalRatios = null;

    const financialSchema = {
      type: "OBJECT",
      properties: {
        reporting_period: { type: "STRING" },
        currency: { type: "STRING" },
        revenue: { type: "NUMBER" },
        gross_profit: { type: "NUMBER" },
        operating_income: { type: "NUMBER" },
        depreciation_amortization: { type: "NUMBER" },
        interest_expense: { type: "NUMBER" },
        tax_expense: { type: "NUMBER" },
        net_income: { type: "NUMBER" },
        cash_and_equivalents: { type: "NUMBER" },
        marketable_securities: { type: "NUMBER" },
        receivables: { type: "NUMBER" },
        inventory: { type: "NUMBER" },
        current_assets: { type: "NUMBER" },
        current_liabilities: { type: "NUMBER" },
        total_debt: { type: "NUMBER" },
        total_assets: { type: "NUMBER" },
        total_equity: { type: "NUMBER" },
        shares_outstanding: { type: "NUMBER" },
        dividend_per_share: { type: "NUMBER" }
      },
      required: ["revenue", "gross_profit", "operating_income", "net_income", "current_assets", "current_liabilities", "total_assets", "total_equity", "shares_outstanding"]
    };

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function processDocument() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const fileInput = document.getElementById("fileUpload");
      const sharePrice = parseFloat(document.getElementById("sharePrice").value) || null;
      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");

      if (!apiKey) { alert("Please provide your Gemini API key."); return; }
      if (!fileInput.files.length) { alert("Please select a PDF or Word file."); return; }

      const file = fileInput.files[0];
      statusDiv.className = "mt-4 text-sm font-medium text-blue-600 block";
      statusDiv.textContent = "Processing document and extracting financial metrics...";
      resultsDiv.classList.add("hidden");

      try {
        let requestContents = [];
        const promptInstruction = "Extract standard financial statement line items for the most recent period. Normalize all values into single full units (e.g., multiply thousands by 1,000, millions by 1,000,000).";

        // Check if DOCX or PDF
        if (file.name.endsWith(".docx")) {
          statusDiv.textContent = "Parsing Word document text...";
          const arrayBuffer = await file.arrayBuffer();
          const parsed = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          requestContents = [{
            parts: [
              { text: promptInstruction },
              { text: parsed.value }
            ]
          }];
        } else {
          statusDiv.textContent = "Uploading PDF binary to Gemini...";
          const base64Data = await fileToBase64(file);
          requestContents = [{
            parts: [
              {
                inline_data: {
                  mime_type: "application/pdf",
                  data: base64Data
                }
              },
              { text: promptInstruction }
            ]
          }];
        }

        statusDiv.textContent = "Querying Gemini 2.5 Flash...";
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: requestContents,
            generationConfig: {
              response_mime_type: "application/json",
              response_schema: financialSchema
            }
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "Model request failed.");
        }

        const resData = await response.json();
        const extracted = JSON.parse(resData.candidates[0].content.parts[0].text);

        statusDiv.textContent = "Calculating ratios...";
        globalRatios = calculateAllRatios(extracted, sharePrice);

        renderRatioTables(globalRatios);
        renderAuditView(extracted);

        statusDiv.classList.add("hidden");
        resultsDiv.classList.remove("hidden");
      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
        statusDiv.className = "mt-4 text-sm font-medium text-red-600 block";
      }
    }

    function calculateAllRatios(d, price) {
      const ebitda = (d.operating_income || 0) + (d.depreciation_amortization || 0);
      const taxBase = d.operating_income - (d.interest_expense || 0);
      const effectiveTaxRate = taxBase > 0 ? ((d.tax_expense || 0) / taxBase) : 0.20;
      const nopat = (d.operating_income || 0) * (1 - effectiveTaxRate);
      const investedCapital = (d.total_debt || 0) + (d.total_equity || 0) - (d.cash_and_equivalents || 0);

      const grossMargin = d.revenue ? ((d.gross_profit / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const opMargin = d.revenue ? ((d.operating_income / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const netMargin = d.revenue ? ((d.net_income / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const roa = d.total_assets ? ((d.net_income / d.total_assets) * 100).toFixed(2) + "%" : "N/A";
      const roe = d.total_equity ? ((d.net_income / d.total_equity) * 100).toFixed(2) + "%" : "N/A";
      const roic = investedCapital > 0 ? ((nopat / investedCapital) * 100).toFixed(2) + "%" : "N/A";

      const eps = d.shares_outstanding ? (d.net_income / d.shares_outstanding).toFixed(4) : "N/A";
      const divYield = (price && d.dividend_per_share) ? ((d.dividend_per_share / price) * 100).toFixed(2) + "%" : "N/A";
      const divPayout = (d.net_income > 0 && d.dividend_per_share) ? (((d.dividend_per_share * d.shares_outstanding) / d.net_income) * 100).toFixed(2) + "%" : "N/A";

      const debtToEquity = d.total_equity ? ((d.total_debt || 0) / d.total_equity).toFixed(2) : "N/A";
      const debtToAsset = d.total_assets ? ((d.total_debt || 0) / d.total_assets).toFixed(2) : "N/A";
      const intCoverage = (d.interest_expense && d.interest_expense > 0) ? (d.operating_income / d.interest_expense).toFixed(2) : "N/A";

      const currentRatio = d.current_liabilities ? (d.current_assets / d.current_liabilities).toFixed(2) : "N/A";
      const quickAssets = (d.cash_and_equivalents || 0) + (d.marketable_securities || 0) + (d.receivables || 0);
      const quickRatio = d.current_liabilities ? (quickAssets / d.current_liabilities).toFixed(2) : "N/A";

      let pe = "N/A", pb = "N/A", evEbitda = "N/A";
      if (price && price > 0) {
        const marketCap = price * (d.shares_outstanding || 0);
        if (parseFloat(eps) > 0) pe = (price / parseFloat(eps)).toFixed(2);
        if (d.total_equity > 0) pb = (marketCap / d.total_equity).toFixed(2);
        const ev = marketCap + (d.total_debt || 0) - (d.cash_and_equivalents || 0);
        if (ebitda > 0) evEbitda = (ev / ebitda).toFixed(2);
      }

      return {
        "A. Profitability Ratios": { "Gross Margin": grossMargin, "Operating Margin": opMargin, "Net Margin": netMargin, "ROA": roa, "ROE": roe, "ROIC": roic },
        "B. Earnings Ratios": { "EPS": eps, "Dividend Yield": divYield, "Dividend Payout Ratio": divPayout },
        "C. Solvency Ratios": { "Debt to Equity": debtToEquity, "Debt to Asset": debtToAsset, "Interest Coverage Ratio": intCoverage },
        "D. Liquidity Ratios": { "Current Ratio": currentRatio, "Quick Ratio": quickRatio },
        "E. Valuation Ratios": { "P/E": pe, "P/B": pb, "EV/EBITDA": evEbitda }
      };
    }

    function renderRatioTables(ratios) {
      const container = document.getElementById("tablesContainer");
      container.innerHTML = "";
      for (const [category, metrics] of Object.entries(ratios)) {
        let rows = "";
        for (const [name, val] of Object.entries(metrics)) {
          rows += `
            <tr class="border-b hover:bg-gray-50">
              <td class="py-2.5 px-4 font-medium text-gray-700">${name}</td>
              <td class="py-2.5 px-4 text-right font-bold text-gray-900">${val}</td>
            </tr>`;
        }
        container.innerHTML += `
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 font-bold text-gray-700 text-xs tracking-wider uppercase">${category}</div>
            <table class="w-full text-sm"><tbody>${rows}</tbody></table>
          </div>`;
      }
    }

    function renderAuditView(extracted) {
      const container = document.getElementById("extractedDataView");
      let rows = "";
      for (const [key, value] of Object.entries(extracted)) {
        const displayVal = (typeof value === "number") ? value.toLocaleString() : (value || "—");
        rows += `
          <tr class="border-b">
            <td class="py-1.5 px-3 font-mono text-xs text-gray-600">${key}</td>
            <td class="py-1.5 px-3 font-semibold text-right text-gray-800">${displayVal}</td>
          </tr>`;
      }
      container.innerHTML = `<table class="w-full text-xs"><tbody>${rows}</tbody></table>`;
    }

    function downloadCSV() {
      if (!globalRatios) return;
      let csv = "Category,Metric,Value\n";
      for (const [category, metrics] of Object.entries(globalRatios)) {
        for (const [metric, val] of Object.entries(metrics)) {
          csv += `"${category}","${metric}","${val}"\n`;
        }
      }
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", "financial_ratios.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
