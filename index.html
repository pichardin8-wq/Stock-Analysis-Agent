<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSX Financial Ratio Analyzer (KHR)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mammoth for .docx parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow border border-gray-200">
    <header class="mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">CSX Financial Ratio Analyzer</h1>
          <p class="text-xs text-gray-500 mt-1">Calibrated to Cambodia Securities Exchange (CSX) calculation rules & SERC guidelines.</p>
        </div>
        <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded">1 USD = 4,000 KHR</span>
      </div>
    </header>

    <!-- Stock Selection & Market Inputs -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Company / Template</label>
        <select id="companyType" onchange="executeCalculations()" class="w-full border rounded-lg p-2 text-xs bg-white focus:ring-2 focus:ring-blue-500 font-medium">
          <option value="STANDARD">Standard Company (e.g. ABC, GTI, MJQE)</option>
          <option value="PWSA">PWSA (Deducts Class A Non-voting)</option>
          <option value="PPAP">PPAP (Deducts Class C Non-voting)</option>
          <option value="PAS">PAS (Deducts Class A Non-voting)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Gemini API Key</label>
        <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Share Price</label>
        <div class="flex">
          <input id="sharePrice" type="number" step="any" placeholder="e.g. 9080" oninput="executeCalculations()" class="w-2/3 border rounded-l-lg p-2 text-xs" />
          <select id="priceCurrency" onchange="executeCalculations()" class="w-1/3 border-t border-b border-r rounded-r-lg p-1 text-xs bg-gray-50">
            <option value="KHR" selected>KHR</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Dividend Per Share (DPS)</label>
        <div class="flex">
          <input id="manualDPS" type="number" step="any" placeholder="e.g. 350" oninput="executeCalculations()" class="w-2/3 border rounded-l-lg p-2 text-xs" />
          <select id="dpsCurrency" onchange="executeCalculations()" class="w-1/3 border-t border-b border-r rounded-r-lg p-1 text-xs bg-gray-50">
            <option value="KHR" selected>KHR</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
    </div>

    <!-- CSX Specific Inputs Accordion -->
    <details class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
      <summary class="text-xs font-bold text-blue-900 cursor-pointer select-none">
        CSX Custom Parameters (Share Counts & Prior Year Balances in KHR)
      </summary>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mt-3">
        <div>
          <label class="block text-xs text-gray-600 mb-1">Listed Shares Count</label>
          <input id="listedShares" type="number" step="any" placeholder="Shares on CSX" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Non-Listed Shares Count</label>
          <input id="nonListedShares" type="number" step="any" placeholder="Unlisted / SOE shares" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Total Dividend Paid (KHR)</label>
          <input id="totalDividend" type="number" step="any" placeholder="For Payout Ratio" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Beg. Assets (KHR)</label>
          <input id="begAssets" type="number" step="any" placeholder="Prior Year Assets" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Beg. Equity (KHR)</label>
          <input id="begEquity" type="number" step="any" placeholder="Prior Year Equity" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Current Assets (KHR)</label>
          <input id="manualCA" type="number" step="any" placeholder="For banks / missing" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Current Liabilities (KHR)</label>
          <input id="manualCL" type="number" step="any" placeholder="For banks / missing" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Invested Capital (KHR)</label>
          <input id="manualIC" type="number" step="any" placeholder="For ROIC" oninput="executeCalculations()" class="w-full border rounded p-1.5 text-xs" />
        </div>
      </div>
    </details>

    <div class="mb-5">
      <label class="block text-xs font-semibold text-gray-700 mb-1">Upload Report (PDF or Word .docx)</label>
      <input id="fileUpload" type="file" accept=".pdf, .docx, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="w-full border rounded-lg p-2 text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200" />
    </div>

    <button id="runBtn" onclick="processDocument()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">
      Analyze Document & Calculate CSX Ratios
    </button>

    <div id="status" class="mt-4 text-sm font-medium text-blue-600 hidden"></div>

    <!-- Output Section -->
    <div id="results" class="mt-8 hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 border-b pb-3">
        <div>
          <h2 class="text-lg font-bold text-gray-900">CSX Ratio Analysis Results</h2>
          <span id="detectedCurrencyBadge" class="text-xs font-medium px-2 py-0.5 rounded bg-gray-200 text-gray-700"></span>
        </div>
        <button onclick="downloadCSV()" class="inline-flex items-center justify-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-1.5 px-3 rounded-lg shadow transition">
          Export CSV
        </button>
      </div>

      <div id="tablesContainer" class="space-y-5 mb-8"></div>

      <details class="bg-gray-50 border rounded-lg p-3 text-xs">
        <summary class="font-semibold text-gray-700 cursor-pointer select-none">
          View Extracted Line Items (Normalized in KHR Riel)
        </summary>
        <div id="extractedDataView" class="mt-2 overflow-x-auto"></div>
      </details>
    </div>
  </div>

  <script>
    const USD_TO_KHR = 4000;
    let globalRatios = null;
    let rawExtractedData = null;

    const financialSchema = {
      type: "OBJECT",
      properties: {
        currency: { type: "STRING" },
        revenue: { type: "NUMBER" },
        gross_profit: { type: "NUMBER" },
        operating_income: { type: "NUMBER" },
        depreciation_amortization: { type: "NUMBER" },
        interest_expense: { type: "NUMBER" },
        tax_expense: { type: "NUMBER" },
        net_income: { type: "NUMBER" },
        cash_and_equivalents: { type: "NUMBER" },
        marketable_securities: { type: "NUMBER" },
        receivables: { type: "NUMBER" },
        inventory: { type: "NUMBER" },
        current_assets: { type: "NUMBER" },
        current_liabilities: { type: "NUMBER" },
        total_debt: { type: "NUMBER" },
        total_assets: { type: "NUMBER" },
        beginning_assets: { type: "NUMBER" },
        total_equity: { type: "NUMBER" },
        beginning_equity: { type: "NUMBER" },
        shares_outstanding: { type: "NUMBER" },
        total_dividend: { type: "NUMBER" },
        dividend_per_share: { type: "NUMBER" }
      },
      required: ["revenue", "operating_income", "net_income", "total_assets", "total_equity", "shares_outstanding"]
    };

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function processDocument() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const fileInput = document.getElementById("fileUpload");
      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");

      if (!apiKey) { alert("Please provide your Gemini API key."); return; }
      if (!fileInput.files.length) { alert("Please select a PDF or Word file."); return; }

      const file = fileInput.files[0];
      statusDiv.className = "mt-4 text-sm font-medium text-blue-600 block";
      statusDiv.textContent = "Processing financial report...";
      resultsDiv.classList.add("hidden");

      try {
        let requestContents = [];
        const promptInstruction = "Extract financial line items for the latest reporting year. If previous year assets and equity are listed in the statements, extract them as beginning_assets and beginning_equity. Normalize units to single full numbers (multiply thousands by 1,000, millions by 1,000,000). State if figures are in USD or KHR.";

        if (file.name.endsWith(".docx")) {
          statusDiv.textContent = "Extracting Word text...";
          const arrayBuffer = await file.arrayBuffer();
          const parsed = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
          requestContents = [{ parts: [{ text: promptInstruction }, { text: parsed.value }] }];
        } else {
          statusDiv.textContent = "Uploading PDF binary...";
          const base64Data = await fileToBase64(file);
          requestContents = [{ parts: [{ inline_data: { mime_type: "application/pdf", data: base64Data } }, { text: promptInstruction }] }];
        }

        statusDiv.textContent = "Extracting data with Gemini 3.6 Flash...";
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: requestContents,
            generationConfig: {
              response_mime_type: "application/json",
              response_schema: financialSchema
            }
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "Document extraction failed.");
        }

        const resData = await response.json();
        rawExtractedData = JSON.parse(resData.candidates[0].content.parts[0].text);

        executeCalculations();

        statusDiv.classList.add("hidden");
        resultsDiv.classList.remove("hidden");
      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
        statusDiv.className = "mt-4 text-sm font-medium text-red-600 block";
      }
    }

    function executeCalculations() {
      if (!rawExtractedData) return;

      const docCurrency = (rawExtractedData.currency || "USD").toUpperCase();
      const isUSD = docCurrency.includes("USD") || docCurrency.includes("$");
      const multiplier = isUSD ? USD_TO_KHR : 1.0;

      // Base line items normalized to KHR
      const d = {};
      for (const [key, val] of Object.entries(rawExtractedData)) {
        if (typeof val === "number" && !key.includes("shares")) {
          d[key] = val * multiplier;
        } else {
          d[key] = val;
        }
      }

      // Read manual and CSX inputs
      const companyType = document.getElementById("companyType").value;
      const priceInput = parseFloat(document.getElementById("sharePrice").value);
      const priceCurrency = document.getElementById("priceCurrency").value;
      let priceInKHR = (!isNaN(priceInput) && priceInput > 0) ? (priceCurrency === "USD" ? priceInput * USD_TO_KHR : priceInput) : null;

      const manualDPSInput = parseFloat(document.getElementById("manualDPS").value);
      const dpsCurrency = document.getElementById("dpsCurrency").value;
      if (!isNaN(manualDPSInput) && manualDPSInput >= 0) {
        d.dividend_per_share = (dpsCurrency === "USD") ? manualDPSInput * USD_TO_KHR : manualDPSInput;
      }

      const inputTotalDiv = parseFloat(document.getElementById("totalDividend").value);
      if (!isNaN(inputTotalDiv)) d.total_dividend = inputTotalDiv;

      const inputBegAssets = parseFloat(document.getElementById("begAssets").value);
      if (!isNaN(inputBegAssets)) d.beginning_assets = inputBegAssets;

      const inputBegEquity = parseFloat(document.getElementById("begEquity").value);
      if (!isNaN(inputBegEquity)) d.beginning_equity = inputBegEquity;

      const manualCA = parseFloat(document.getElementById("manualCA").value);
      if (!isNaN(manualCA)) d.current_assets = manualCA;
      const manualCL = parseFloat(document.getElementById("manualCL").value);
      if (!isNaN(manualCL)) d.current_liabilities = manualCL;
      const manualIC = parseFloat(document.getElementById("manualIC").value);

      const inputListed = parseFloat(document.getElementById("listedShares").value);
      const listedShares = (!isNaN(inputListed) && inputListed > 0) ? inputListed : (d.shares_outstanding || 0);
      const inputNonListed = parseFloat(document.getElementById("nonListedShares").value) || 0;

      document.getElementById("detectedCurrencyBadge").textContent = `Report: ${docCurrency} | Converted at 1 USD = 4,000 KHR`;

      // -------------------------------------------------------------
      // CSX FORMULA CALCULATIONS
      // -------------------------------------------------------------

      // 1 & 2: Market Capitalizations
      let mktCap = "N/A", fullMktCap = "N/A";
      if (priceInKHR && listedShares > 0) {
        mktCap = (listedShares * priceInKHR).toLocaleString() + " ៛";
        fullMktCap = ((listedShares + inputNonListed) * priceInKHR).toLocaleString() + " ៛";
      }

      // 5: Book Value per share adjustments (CSX SOE Rules)
      let adjustedEquity = d.total_equity || 0;
      if (companyType === "PWSA") {
        adjustedEquity -= (391100942 * 1000); // Exclude Class A par KHR 1,000
      } else if (companyType === "PPAP") {
        adjustedEquity -= (93769120 * 4000);  // Exclude Class C par KHR 4,000
      } else if (companyType === "PAS") {
        adjustedEquity -= (364530861 * 1000); // Exclude Class A par KHR 1,000
      }

      const bvps = (listedShares > 0 && adjustedEquity > 0) ? (adjustedEquity / listedShares) : null;
      let pbRatio = (priceInKHR && bvps && bvps > 0) ? (priceInKHR / bvps).toFixed(2) : "N/A";

      // 9 & 10: ROE and ROA with Beginning & Ending Averages
      const avgEquity = (d.beginning_equity && d.total_equity) ? ((d.beginning_equity + d.total_equity) / 2) : d.total_equity;
      const avgAssets = (d.beginning_assets && d.total_assets) ? ((d.beginning_assets + d.total_assets) / 2) : d.total_assets;

      const roe = (avgEquity && d.net_income) ? ((d.net_income / avgEquity) * 100).toFixed(2) + "%" : "N/A";
      const roa = (avgAssets && d.net_income) ? ((d.net_income / avgAssets) * 100).toFixed(2) + "%" : "N/A";

      // 11: A/E (Assets / Equities)
      const aeRatio = (d.total_assets && d.total_equity) ? (d.total_assets / d.total_equity).toFixed(2) : "N/A";

      // Profitability & Margins
      const grossMargin = (d.revenue && d.gross_profit) ? ((d.gross_profit / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const opMargin = (d.revenue && d.operating_income) ? ((d.operating_income / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const netMargin = (d.revenue && d.net_income) ? ((d.net_income / d.revenue) * 100).toFixed(2) + "%" : "N/A";

      // ROIC
      const ebitda = (d.operating_income || 0) + (d.depreciation_amortization || 0);
      const taxBase = (d.operating_income || 0) - (d.interest_expense || 0);
      const effTax = taxBase > 0 ? ((d.tax_expense || 0) / taxBase) : 0.20;
      const nopat = (d.operating_income || 0) * (1 - effTax);
      const investedCap = !isNaN(manualIC) ? manualIC : ((d.total_debt || 0) + (d.total_equity || 0) - (d.cash_and_equivalents || 0));
      const roic = investedCap > 0 ? ((nopat / investedCap) * 100).toFixed(2) + "%" : "N/A";

      // 13: EPS
      const eps = (listedShares > 0 && d.net_income) ? (d.net_income / listedShares) : null;
      const epsDisplay = eps !== null ? eps.toFixed(2) + " ៛" : "N/A";

      // 4: P/E
      const peRatio = (priceInKHR && eps && eps > 0) ? (priceInKHR / eps).toFixed(2) : "N/A";

      // 6, 7 & 8: Dividends
      let divYieldDisplay = "N/A";
      if (priceInKHR && d.dividend_per_share) {
        divYieldDisplay = ((d.dividend_per_share / priceInKHR) * 100).toFixed(2) + "%";
      }

      let divPayoutDisplay = "N/A";
      if (d.total_dividend && d.net_income > 0) {
        divPayoutDisplay = ((d.total_dividend / d.net_income) * 100).toFixed(2) + "%";
      } else if (d.dividend_per_share && eps && eps > 0) {
        divPayoutDisplay = ((d.dividend_per_share / eps) * 100).toFixed(2) + "%";
      }

      // Solvency & Liquidity
      const debtToEquity = (d.total_equity && d.total_equity > 0) ? ((d.total_debt || 0) / d.total_equity).toFixed(2) : "N/A";
      const debtToAsset = (d.total_assets && d.total_assets > 0) ? ((d.total_debt || 0) / d.total_assets).toFixed(2) : "N/A";
      const intCoverage = (d.interest_expense && d.interest_expense > 0) ? (d.operating_income / d.interest_expense).toFixed(2) : "N/A";
      const currentRatio = (d.current_assets && d.current_liabilities) ? (d.current_assets / d.current_liabilities).toFixed(2) : "N/A";
      const quickAssets = (d.cash_and_equivalents || 0) + (d.marketable_securities || 0) + (d.receivables || 0);
      const quickRatio = (quickAssets > 0 && d.current_liabilities) ? (quickAssets / d.current_liabilities).toFixed(2) : "N/A";

      // EV / EBITDA
      let evEbitda = "N/A";
      if (priceInKHR && listedShares > 0) {
        const ev = (priceInKHR * listedShares) + (d.total_debt || 0) - (d.cash_and_equivalents || 0);
        if (ebitda > 0) evEbitda = (ev / ebitda).toFixed(2);
      }

      globalRatios = {
        "A. CSX Capitalization & Valuation": {
          "Market Capitalization": mktCap,
          "Full Market Capitalization": fullMktCap,
          "P/E Ratio (Note 4)": peRatio,
          "P/BV Ratio (Note 5)": pbRatio,
          "BVPS (Adjusted for SOE rules)": bvps ? bvps.toFixed(2) + " ៛" : "N/A",
          "EV/EBITDA": evEbitda
        },
        "B. Profitability Ratios (CSX Standard)": {
          "Net Profit Margin (Note 15)": netMargin,
          "Gross Margin": grossMargin,
          "Operating Profit Margin": opMargin,
          "ROE (Avg Equity - Note 9)": roe,
          "ROA (Avg Assets - Note 10)": roa,
          "ROIC": roic
        },
        "C. CSX Earnings & Dividend Metrics": {
          "EPS (Note 13)": epsDisplay,
          "Dividend Yield (Note 6)": divYieldDisplay,
          "Dividend Payout Ratio (Note 7)": divPayoutDisplay,
          "Cash Dividend per Share": d.dividend_per_share ? d.dividend_per_share.toLocaleString() + " ៛" : "N/A"
        },
        "D. Solvency & Leverage Ratios": {
          "A/E (Assets/Equities - Note 11)": aeRatio,
          "Debt to Equity": debtToEquity,
          "Debt to Asset": debtToAsset,
          "Interest Coverage Ratio": intCoverage
        },
        "E. Liquidity Ratios (Note 12)": {
          "Current Ratio": currentRatio,
          "Quick Ratio": quickRatio
        }
      };

      renderRatioTables(globalRatios);
      renderAuditView(d);
    }

    function renderRatioTables(ratios) {
      const container = document.getElementById("tablesContainer");
      container.innerHTML = "";
      for (const [category, metrics] of Object.entries(ratios)) {
        let rows = "";
        for (const [name, val] of Object.entries(metrics)) {
          rows += `
            <tr class="border-b hover:bg-gray-50">
              <td class="py-2.5 px-4 font-medium text-gray-700">${name}</td>
              <td class="py-2.5 px-4 text-right font-bold text-gray-900">${val}</td>
            </tr>`;
        }
        container.innerHTML += `
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 font-bold text-gray-700 text-xs tracking-wider uppercase">${category}</div>
            <table class="w-full text-sm"><tbody>${rows}</tbody></table>
          </div>`;
      }
    }

    function renderAuditView(extracted) {
      const container = document.getElementById("extractedDataView");
      let rows = "";
      for (const [key, value] of Object.entries(extracted)) {
        const displayVal = (typeof value === "number") ? value.toLocaleString() + " ៛" : (value || "—");
        rows += `
          <tr class="border-b">
            <td class="py-1 px-3 font-mono text-xs text-gray-600">${key}</td>
            <td class="py-1 px-3 font-semibold text-right text-gray-800">${displayVal}</td>
          </tr>`;
      }
      container.innerHTML = `<table class="w-full text-xs"><tbody>${rows}</tbody></table>`;
    }

    function downloadCSV() {
      if (!globalRatios) return;
      let csv = "Category,Metric,Value\n";
      for (const [category, metrics] of Object.entries(globalRatios)) {
        for (const [metric, val] of Object.entries(metrics)) {
          csv += `"${category}","${metric}","${val}"\n`;
        }
      }
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", "csx_financial_ratios.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
