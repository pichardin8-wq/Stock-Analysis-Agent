<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Ratio Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Financial Statement Ratio Analyzer</h1>
    <p class="text-sm text-gray-500 mb-6">Upload an annual report or financial statement (PDF) to extract line items and compute key ratios.</p>

    <!-- Configuration Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-sm font-semibold mb-1">Gemini API Key</label>
        <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full border rounded-lg p-2.5 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Market Share Price (Optional)</label>
        <input id="sharePrice" type="number" step="any" placeholder="e.g. 4.50" class="w-full border rounded-lg p-2.5 text-sm" />
      </div>
    </div>

    <!-- File Upload Section -->
    <div class="mb-6">
      <label class="block text-sm font-semibold mb-1">Financial Report (PDF)</label>
      <input id="pdfFile" type="file" accept="application/pdf" class="w-full border rounded-lg p-2 text-sm" />
    </div>

    <button id="analyzeBtn" onclick="runAnalysis()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
      Analyze Document & Calculate Ratios
    </button>

    <div id="status" class="mt-4 text-sm font-medium text-blue-600 hidden"></div>

    <!-- Results Display -->
    <div id="results" class="mt-8 hidden">
      <h2 class="text-xl font-bold mb-4">Calculated Financial Ratios</h2>
      <div id="tablesContainer" class="space-y-6"></div>
    </div>
  </div>

  <script>
    // Define the expected schema for Gemini structured JSON output
    const jsonSchema = {
      type: "OBJECT",
      properties: {
        reporting_year: { type: "INTEGER" },
        currency: { type: "STRING" },
        revenue: { type: "NUMBER" },
        cogs: { type: "NUMBER" },
        gross_profit: { type: "NUMBER" },
        operating_income: { type: "NUMBER" },
        depreciation_amortization: { type: "NUMBER" },
        interest_expense: { type: "NUMBER" },
        tax_expense: { type: "NUMBER" },
        net_income: { type: "NUMBER" },
        cash_and_equivalents: { type: "NUMBER" },
        marketable_securities: { type: "NUMBER" },
        receivables: { type: "NUMBER" },
        inventory: { type: "NUMBER" },
        current_assets: { type: "NUMBER" },
        current_liabilities: { type: "NUMBER" },
        total_debt: { type: "NUMBER" },
        total_assets: { type: "NUMBER" },
        total_equity: { type: "NUMBER" },
        shares_outstanding: { type: "NUMBER" },
        dividend_per_share: { type: "NUMBER" }
      },
      required: ["revenue", "gross_profit", "operating_income", "net_income", "current_assets", "current_liabilities", "total_assets", "total_equity", "shares_outstanding"]
    };

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function runAnalysis() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const fileInput = document.getElementById("pdfFile");
      const sharePrice = parseFloat(document.getElementById("sharePrice").value) || null;
      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");

      if (!apiKey) {
        alert("Please enter your Gemini API Key.");
        return;
      }
      if (!fileInput.files.length) {
        alert("Please select a PDF file.");
        return;
      }

      statusDiv.classList.remove("hidden");
      statusDiv.textContent = "Processing PDF and extracting line items via Gemini...";
      resultsDiv.classList.add("hidden");

      try {
        const base64Data = await fileToBase64(fileInput.files[0]);

        const requestBody = {
          contents: [{
            parts: [
              {
                inline_data: {
                  mime_type: "application/pdf",
                  data: base64Data
                }
              },
              {
                text: "Extract financial line items for the most recent reporting period into standardized single units (e.g. if reported in thousands, multiply by 1000)."
              }
            ]
          }],
          generationConfig: {
            response_mime_type: "application/json",
            response_schema: jsonSchema
          }
        };

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "Extraction failed");
        }

        const data = await response.json();
        const extracted = JSON.parse(data.candidates[0].content.parts[0].text);
        
        statusDiv.textContent = "Computing financial ratios...";
        const ratios = computeRatios(extracted, sharePrice);
        renderResults(ratios);
        statusDiv.classList.add("hidden");
        resultsDiv.classList.remove("hidden");

      } catch (err) {
        statusDiv.textContent = "Error: " + err.message;
        statusDiv.classList.add("text-red-600");
      }
    }

    function computeRatios(d, price) {
      const ebitda = (d.operating_income || 0) + (d.depreciation_amortization || 0);
      const taxRate = (d.operating_income - d.interest_expense > 0) ? (d.tax_expense / (d.operating_income - d.interest_expense)) : 0.20;
      const nopat = (d.operating_income || 0) * (1 - taxRate);
      const investedCap = (d.total_debt || 0) + (d.total_equity || 0) - (d.cash_and_equivalents || 0);

      // Calculations
      const grossMargin = d.revenue ? ((d.gross_profit / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const opMargin = d.revenue ? ((d.operating_income / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const netMargin = d.revenue ? ((d.net_income / d.revenue) * 100).toFixed(2) + "%" : "N/A";
      const roa = d.total_assets ? ((d.net_income / d.total_assets) * 100).toFixed(2) + "%" : "N/A";
      const roe = d.total_equity ? ((d.net_income / d.total_equity) * 100).toFixed(2) + "%" : "N/A";
      const roic = investedCap > 0 ? ((nopat / investedCap) * 100).toFixed(2) + "%" : "N/A";

      const eps = d.shares_outstanding ? (d.net_income / d.shares_outstanding).toFixed(4) : "N/A";
      const divYield = (price && price > 0 && d.dividend_per_share) ? ((d.dividend_per_share / price) * 100).toFixed(2) + "%" : "N/A";
      const divPayout = (d.net_income > 0 && d.dividend_per_share) ? (((d.dividend_per_share * d.shares_outstanding) / d.net_income) * 100).toFixed(2) + "%" : "N/A";

      const debtToEquity = d.total_equity ? ((d.total_debt || 0) / d.total_equity).toFixed(2) : "N/A";
      const debtToAsset = d.total_assets ? ((d.total_debt || 0) / d.total_assets).toFixed(2) : "N/A";
      const intCoverage = (d.interest_expense && d.interest_expense > 0) ? (d.operating_income / d.interest_expense).toFixed(2) : "N/A";

      const currentRatio = d.current_liabilities ? (d.current_assets / d.current_liabilities).toFixed(2) : "N/A";
      const quickAssets = (d.cash_and_equivalents || 0) + (d.marketable_securities || 0) + (d.receivables || 0);
      const quickRatio = d.current_liabilities ? (quickAssets / d.current_liabilities).toFixed(2) : "N/A";

      let pe = "N/A", pb = "N/A", evEbitda = "N/A";
      if (price && price > 0) {
        const marketCap = price * (d.shares_outstanding || 0);
        if (parseFloat(eps) > 0) pe = (price / parseFloat(eps)).toFixed(2);
        if (d.total_equity > 0) pb = (marketCap / d.total_equity).toFixed(2);
        const ev = marketCap + (d.total_debt || 0) - (d.cash_and_equivalents || 0);
        if (ebitda > 0) evEbitda = (ev / ebitda).toFixed(2);
      }

      return {
        "Profitability Ratios": { "Gross Margin": grossMargin, "Operating Margin": opMargin, "Net Margin": netMargin, "ROA": roa, "ROE": roe, "ROIC": roic },
        "Earnings Ratios": { "EPS": eps, "Dividend Yield": divYield, "Dividend Payout Ratio": divPayout },
        "Solvency Ratios": { "Debt to Equity": debtToEquity, "Debt to Asset": debtToAsset, "Interest Coverage Ratio": intCoverage },
        "Liquidity Ratios": { "Current Ratio": currentRatio, "Quick Ratio": quickRatio },
        "Valuation Ratios": { "P/E": pe, "P/B": pb, "EV/EBITDA": evEbitda }
      };
    }

    function renderResults(ratios) {
      const container = document.getElementById("tablesContainer");
      container.innerHTML = "";
      for (const [category, metrics] of Object.entries(ratios)) {
        let rows = "";
        for (const [name, val] of Object.entries(metrics)) {
          rows += `<tr class="border-b"><td class="py-2 px-4 font-medium text-gray-700">${name}</td><td class="py-2 px-4 text-right font-bold text-gray-900">${val}</td></tr>`;
        }
        container.innerHTML += `
          <div class="border rounded-lg overflow-hidden">
            <div class="bg-gray-100 px-4 py-2 font-bold text-gray-800 text-sm tracking-wide uppercase">${category}</div>
            <table class="w-full text-sm"><tbody>${rows}</tbody></table>
          </div>`;
      }
    }
  </script>
</body>
</html>
